name: update-feed

on:
  schedule:
    - cron: "0 21 * * *"   # 매일 한국 시간 오전 6시 (UTC 21시)
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "products.json"
      - "seen.json"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4

      - name: 상품 수집
        run: python collector.py

      - name: 결과 저장
        run: |
          git config user.name "shopfeed-bot"
          git config user.email "shopfeed-bot@users.noreply.github.com"
          git add products.json seen.json
          git diff --cached --quiet || git commit -m "상품 목록 갱신"
          git push

      - name: 사이트 만들기
        run: python build_site.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
